<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recetas para el sin ideas</title>
</head>
<body>
    <h1>Recetas para el sin ideas</h1>
    
    <script>
      fetch("https://462082b4-0042-414a-a8a2-43f02e564238-00-3efzvacs5icdk.riker.replit.dev/api/recetas")  // Usamos la URL pública de la API
        .then(response => response.json())
        .then(data => {
          let container = document.createElement("ul");
          container.style.listStyle = "none";
          container.style.padding = "10px";

          data.forEach(receta => {
            let item = document.createElement("li");
            item.innerHTML = `<strong>🍽️ ${receta.nombre}:</strong> ${receta.ingredientes.join(", ")}`;
            item.style.marginBottom = "5px";
            container.appendChild(item);
          });

          document.body.appendChild(container);
        })
        .catch(error => console.error("Error al cargar recetas:", error));
    </script>
</body>
</body>
</html>
