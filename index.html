<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewpoint" content="width=device-width, initial-scale=1.0">
  <title>Recetas para el sin ideas</title>
  <link rel="stylesheet" href="style.css">
</head>
  <body>
    <h1>Recetas para el sin ideas</h1>
    <img src="https://github.com/Cesarweon/Recetas-para-el-sin-ideas/blob/Prueba/Dibujo%20de%20una%20cocina.png?raw=true">
    <p>Recetas para cuando no tienes ideas de que comer</p>
    <button class="button"><a href="masa_para_pizza.html"> Masa para pizza</a></button>  
    <button class="button"><a href="Pure_de_papas.html">Puré de papas</a></button>  
    <button class="button"><a href="Albondigas_boloñesa.html">Albondigas boloñesa</a></button>
    <button class="button"><a href="Macarrones_con_queso.html">Macarrones con queso</a></button>  
    <li> 1 kilo = 2.2 Libras</li>
    <li> 1 gramo = 0.035 Onzas</li>
    <li> 1 ml = 0.034 Onza liquida</li>
   </body>
 <script>
  fetch("https://462082b4-0042-414a-a8a2-43f02e564238-00-3efzvacs5icdk.riker.replit.dev/api/recetas")  // Usamos la URL pública de la API
    .then(response => response.json())
    .then(data => {
      let container = document.createElement("ul");
      container.style.listStyle = "none";
      container.style.padding = "10px";

      data.forEach(receta => {
        let item = document.createElement("li");
        item.innerHTML = `<strong>🍽️ ${receta.nombre}:</strong> ${receta.ingredientes.join(", ")}`;
        item.style.marginBottom = "5px";
        container.appendChild(item);
      });

      document.body.appendChild(container);
    })
    .catch(error => console.error("Error al cargar recetas:", error));
</script>


</html>
